name: Build POC404.exe

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"          # build.py prints cargo's output; Windows' default cp1252 would crash on it
  CARGO_TERM_COLOR: never
  CARGO_NET_RETRY: "10"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Allow long paths
        run: git config --system core.longpaths true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pillow
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
      - name: Build POC404.exe
        run: python build.py --build
      - uses: actions/upload-artifact@v4
        with:
          name: POC404
          path: dist/POC404.exe
          if-no-files-found: error
